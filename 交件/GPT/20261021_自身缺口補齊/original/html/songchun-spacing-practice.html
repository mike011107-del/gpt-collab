<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
#sc-spacing-practice .sc-stage{position:relative;width:100%;overflow:hidden}
#sc-spacing-practice .sc-paper{--sc-ink:#23292b;--sc-soft:#60696c;background:#fff;color:var(--sc-ink);padding:32px;min-height:410px;box-sizing:border-box;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;width:736px;overflow-wrap:anywhere;transform:scale(var(--sc-proof-scale,1));transform-origin:left top}
#sc-spacing-practice .sc-paper *{box-sizing:border-box}
#sc-spacing-practice .sc-meta{display:flex;justify-content:space-between;gap:15px;color:var(--sc-soft);font-size:12px;letter-spacing:.06em;padding-bottom:21px}
#sc-spacing-practice .sc-name{font-size:80.96px;line-height:1.1;font-weight:700;letter-spacing:var(--sc-name-spacing);margin:5px 0 24px}
#sc-spacing-practice .sc-full{font-size:17px;line-height:1.6;font-weight:500;letter-spacing:.025em}
#sc-spacing-practice .sc-services{font-size:19px;line-height:1.65;margin-top:20px;padding-top:16px;border-top:2px solid var(--sc-ink)}
#sc-spacing-practice .sc-note{font-size:11px;color:var(--sc-soft);line-height:1.5;margin-top:24px}
#sc-spacing-practice .sc-sample{min-width:0}
</style>
<div id="sc-spacing-practice">
  <div class="viz-controls">
    <button type="button" class="btn" id="sc-spacing-scale" aria-pressed="false">等比縮小</button>
    <span class="text-small" id="sc-spacing-scale-label" aria-live="polite">同一版面</span>
  </div>
  <div class="viz-carousel viz-dotted-background" aria-label="名稱先行：只比較字距" data-previous-label="前一稿" data-next-label="後一稿">
    <section class="sc-sample" data-variant="原稿" aria-label="原稿" data-spacing="0.055">
      <div class="sc-stage"><div class="sc-paper" style="--sc-name-spacing:.055em" aria-label="原稿的名稱先行試排">
        <div class="sc-meta"><span>崧淳｜白底單色試排</span><span>名稱先行</span></div>
        <div class="sc-name"><span class="sc-name-text">崧淳</span></div>
        <div class="sc-full">崧淳環保科技股份有限公司</div>
        <div class="sc-services">污水下水道清淤<br>管內CCTV檢視</div>
        <div class="sc-note">文字與版面研究・配色及正式Logo未定</div>
      </div></div>
    </section>
    <section class="sc-sample" data-variant="收緊字距" aria-label="收緊字距" data-spacing="0" hidden>
      <div class="sc-stage"><div class="sc-paper" style="--sc-name-spacing:0em" aria-label="收緊字距的名稱先行試排">
        <div class="sc-meta"><span>崧淳｜白底單色試排</span><span>名稱先行</span></div>
        <div class="sc-name"><span class="sc-name-text">崧淳</span></div>
        <div class="sc-full">崧淳環保科技股份有限公司</div>
        <div class="sc-services">污水下水道清淤<br>管內CCTV檢視</div>
        <div class="sc-note">文字與版面研究・配色及正式Logo未定</div>
      </div></div>
    </section>
    <section class="sc-sample" data-variant="放寬字距" aria-label="放寬字距" data-spacing="0.14" hidden>
      <div class="sc-stage"><div class="sc-paper" style="--sc-name-spacing:.14em" aria-label="放寬字距的名稱先行試排">
        <div class="sc-meta"><span>崧淳｜白底單色試排</span><span>名稱先行</span></div>
        <div class="sc-name"><span class="sc-name-text">崧淳</span></div>
        <div class="sc-full">崧淳環保科技股份有限公司</div>
        <div class="sc-services">污水下水道清淤<br>管內CCTV檢視</div>
        <div class="sc-note">文字與版面研究・配色及正式Logo未定</div>
      </div></div>
    </section>
    <section class="sc-sample" data-variant="中間值回修" aria-label="中間值回修" data-spacing="0.025" hidden>
      <div class="sc-stage"><div class="sc-paper" style="--sc-name-spacing:.025em" aria-label="中間值回修的名稱先行試排">
        <div class="sc-meta"><span>崧淳｜白底單色試排</span><span>名稱先行</span></div>
        <div class="sc-name"><span class="sc-name-text">崧淳</span></div>
        <div class="sc-full">崧淳環保科技股份有限公司</div>
        <div class="sc-services">污水下水道清淤<br>管內CCTV檢視</div>
        <div class="sc-note">文字與版面研究・配色及正式Logo未定</div>
      </div></div>
    </section>
  </div>
</div>
<script>
(()=>{
  const root=document.getElementById('sc-spacing-practice');
  const scaleButton=document.getElementById('sc-spacing-scale');
  const scaleLabel=document.getElementById('sc-spacing-scale-label');
  const state={small:false};
  function render(){
    const maximum=state.small?.5:1;
    const width=root.clientWidth;
    const scale=Math.min(maximum,width/736);
    const visible=root.querySelector('.sc-sample:not([hidden]) .sc-paper');
    const naturalHeight=visible?visible.offsetHeight:488;
    root.querySelectorAll('.sc-stage').forEach(stage=>stage.style.height=Math.ceil(naturalHeight*scale)+'px');
    root.style.setProperty('--sc-proof-scale',scale);
    scaleButton.setAttribute('aria-pressed',String(state.small));
    scaleLabel.textContent='同一版面・'+Math.round(scale*100)+'%';
  }
  scaleButton.addEventListener('click',()=>{state.small=!state.small;render();});
  new ResizeObserver(render).observe(root);
  new MutationObserver(render).observe(root.querySelector('.viz-carousel'),{subtree:true,attributes:true,attributeFilter:['hidden']});
  document.fonts.ready.then(render);
  render();
})();
</script>
