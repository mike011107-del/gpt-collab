<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@400;500;700&amp;display=swap">
<style>
#sc-reading{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}
#sc-reading .sc-paper{--sc-ink:#23292b;--sc-soft:#60696c;--sc-line:#d3d6d6;background:#fff;color:var(--sc-ink);padding:32px;min-height:410px;box-sizing:border-box;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;max-width:100%;overflow-wrap:anywhere}
#sc-reading .sc-paper *{box-sizing:border-box}
#sc-reading .sc-meta{display:flex;justify-content:space-between;gap:15px;color:var(--sc-soft);font-size:12px;letter-spacing:.06em;padding-bottom:21px}
#sc-reading .sc-name{font-size:clamp(48px,11vw,86px);line-height:1.1;font-weight:700;letter-spacing:.055em;margin:5px 0 24px}
#sc-reading .sc-full{font-size:17px;line-height:1.6;font-weight:500;letter-spacing:.025em}
#sc-reading .sc-services{font-size:19px;line-height:1.65;margin-top:20px;padding-top:16px;border-top:2px solid var(--sc-ink)}
#sc-reading .sc-lane{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px}
#sc-reading .sc-lane div{border-top:2px solid var(--sc-ink);padding-top:12px}
#sc-reading .sc-lane strong{display:block;font-size:38px;font-weight:700;line-height:1.3;letter-spacing:.035em}
#sc-reading .sc-lane span{display:block;margin-top:8px;font-size:15px;line-height:1.6}
#sc-reading .sc-document{display:grid;grid-template-columns:130px 1fr;gap:34px;margin-top:12px}
#sc-reading .sc-side .sc-name{font-size:48px;letter-spacing:.03em;margin:0 0 18px}
#sc-reading .sc-side .sc-full{font-size:14px;line-height:1.8}
#sc-reading .sc-data{border-left:1px solid var(--sc-line);padding-left:27px}
#sc-reading .sc-title{font-size:27px;line-height:1.45;font-weight:500;margin-bottom:23px}
#sc-reading .sc-field{display:grid;grid-template-columns:65px 1fr;gap:14px;border-top:1px solid var(--sc-line);padding:10px 0;font-size:13px;line-height:1.55}
#sc-reading .sc-field span:first-child{color:var(--sc-soft)}
#sc-reading .sc-note{font-size:11px;color:var(--sc-soft);line-height:1.5;margin-top:24px}
#sc-reading .sc-variant{min-height:410px}
@media(max-width:460px){#sc-reading .sc-paper{padding:23px 20px;min-height:585px}#sc-reading .sc-lane{gap:18px}#sc-reading .sc-lane strong{font-size:31px}#sc-reading .sc-document{grid-template-columns:1fr;gap:20px}#sc-reading .sc-side .sc-name{font-size:43px;margin-bottom:9px}#sc-reading .sc-data{border-left:0;padding-left:0}#sc-reading .sc-full{font-size:15px}#sc-reading .sc-meta{font-size:11px;flex-wrap:wrap}#sc-reading .sc-variant{min-height:585px}}
</style>
<div id="sc-reading">
  <div class="viz-carousel viz-dotted-background" aria-label="崧淳名稱與服務資訊的三種試排" data-previous-label="前一稿" data-next-label="後一稿">
    <section class="sc-variant" data-variant="名稱先行" aria-label="名稱先行">
      <div class="sc-paper" aria-label="名稱先行的文字研究">
        <div class="sc-meta"><span>崧淳｜白底單色試排</span><span>名稱先行</span></div>
        <div class="sc-name">崧淳</div>
        <div class="sc-full">崧淳環保科技股份有限公司</div>
        <div class="sc-services">污水下水道清淤<br>管內CCTV檢視</div>
        <div class="sc-note">文字與版面研究・配色及正式Logo未定</div>
      </div>
    </section>
    <section class="sc-variant" data-variant="工項並列" aria-label="工項並列" hidden>
      <div class="sc-paper" aria-label="工項並列的文字研究">
        <div class="sc-meta"><span>崧淳｜白底單色試排</span><span>工項並列</span></div>
        <div class="sc-full">崧淳環保科技股份有限公司</div>
        <div class="sc-lane"><div><strong>清淤</strong><span>污水下水道</span></div><div><strong>檢視</strong><span>管內CCTV</span></div></div>
        <div class="sc-name" style="font-size:48px;margin-top:25px;margin-bottom:8px">崧淳</div>
        <div class="sc-note">文字與版面研究・配色及正式Logo未定</div>
      </div>
    </section>
    <section class="sc-variant" data-variant="資料對應" aria-label="資料對應" hidden>
      <div class="sc-paper" aria-label="工務資料閱讀關係研究">
        <div class="sc-meta"><span>崧淳｜白底單色試排</span><span>資料對應</span></div>
        <div class="sc-document">
          <div class="sc-side"><div class="sc-name">崧淳</div><div class="sc-full">崧淳環保科技<br>股份有限公司</div></div>
          <div class="sc-data"><div class="sc-title">清淤與<br>管內CCTV檢視</div><div class="sc-field"><span>工項</span><span>清淤／檢視</span></div><div class="sc-field"><span>管段</span><span>工程資料位置</span></div><div class="sc-field"><span>影像</span><span>原影像與圖說對應</span></div></div>
        </div>
        <div class="sc-note">工務版面研究・未置入真實案件或工程成果</div>
      </div>
    </section>
  </div>
</div>
<script>
(()=>{
  const root=document.getElementById('sc-reading');
  const state={type:'黑體',spacing:.055,weight:700};
  function render(){
    root.querySelectorAll('.sc-paper').forEach(el=>el.style.fontFamily=state.type==='明體'?"'Noto Serif TC','Microsoft JhengHei',serif":"'Noto Sans TC','Microsoft JhengHei',sans-serif");
    root.querySelectorAll('.sc-name').forEach(el=>{el.style.letterSpacing=state.spacing+'em';el.style.fontWeight=state.weight;});
  }
  render();
  if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addSelect(state,'type',{label:'中文字形',options:['黑體','明體']});t.addSlider(state,'spacing',{label:'崧淳字距',min:0,max:.14,step:.01,unit:'em'});t.addSlider(state,'weight',{label:'名稱字重',min:500,max:800,step:100});}
})();
</script>
