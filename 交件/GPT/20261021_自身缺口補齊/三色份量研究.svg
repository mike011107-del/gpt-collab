<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040"><rect width="100%" height="100%" fill="#F6F6F2"/>
<text x="64" y="70" fill="#25343A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="34" font-weight="700">崧淳｜同一組三色的份量研究</text>
<text x="64" y="108" fill="#25343A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="20" font-weight="400">只改色帶的寬度；文字、字級、底色、排列與三個HEX維持相同。</text>
<text x="64" y="140" fill="#25343A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="19" font-weight="400">研究色：深青 #0C424A　照片參考黃 #D68702　試驗紅 #A52D3A</text>
<rect x="64" y="188" width="1152" height="196" fill="#FFFFFF"/>
<text x="88" y="222" fill="#25343A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="20" font-weight="700">A  等量比較</text>
<text x="805" y="223" fill="#25343A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="18" font-weight="400">1/3 : 1/3 : 1/3</text>
<text x="88" y="270" fill="#0C424A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="29" font-weight="700">崧淳環保科技股份有限公司</text>
<text x="88" y="309" fill="#0C424A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="20" font-weight="400">污水下水道清淤及CCTV檢視工程</text>
<rect x="64" y="348" width="384" height="36" fill="#0C424A"/>
<rect x="448" y="348" width="384" height="36" fill="#D68702"/>
<rect x="832" y="348" width="384" height="36" fill="#A52D3A"/>
<rect x="64" y="410" width="1152" height="196" fill="#FFFFFF"/>
<text x="88" y="444" fill="#25343A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="20" font-weight="700">B  冷色為主，黃次之</text>
<text x="805" y="445" fill="#25343A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="18" font-weight="400">約70 / 20 / 10</text>
<text x="88" y="492" fill="#0C424A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="29" font-weight="700">崧淳環保科技股份有限公司</text>
<text x="88" y="531" fill="#0C424A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="20" font-weight="400">污水下水道清淤及CCTV檢視工程</text>
<rect x="64" y="570" width="806" height="36" fill="#0C424A"/>
<rect x="870" y="570" width="231" height="36" fill="#D68702"/>
<rect x="1101" y="570" width="115" height="36" fill="#A52D3A"/>
<rect x="64" y="632" width="1152" height="196" fill="#FFFFFF"/>
<text x="88" y="666" fill="#25343A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="20" font-weight="700">C  冷色為主，紅次之</text>
<text x="805" y="667" fill="#25343A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="18" font-weight="400">約70 / 10 / 20</text>
<text x="88" y="714" fill="#0C424A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="29" font-weight="700">崧淳環保科技股份有限公司</text>
<text x="88" y="753" fill="#0C424A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="20" font-weight="400">污水下水道清淤及CCTV檢視工程</text>
<rect x="64" y="792" width="806" height="36" fill="#0C424A"/>
<rect x="870" y="792" width="115" height="36" fill="#D68702"/>
<rect x="985" y="792" width="231" height="36" fill="#A52D3A"/>
<text x="64" y="905" fill="#25343A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="23" font-weight="700">本輪觀察</text>
<text x="64" y="943" fill="#25343A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="20" font-weight="400">B的冷色主次較明確；C的紅色較重。這是設計判斷，尚待同圖回評。</text>
<text x="64" y="980" fill="#25343A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="20" font-weight="400">三列的兩色模型分數完全相同；模型不會替我們決定三色用量。</text>
<text x="64" y="1014" fill="#25343A" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="17" font-weight="400">色帶僅供研究；用量比例與命格30%／市場70%的選案權重無關。</text>
</svg>
